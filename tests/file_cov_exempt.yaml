# file_cov_exempt.yaml
#
# 用来配置「文件覆盖率」统计时需要豁免的路径
#
# 配置以组件为最小单位，组件名与 classify_rule 一致，例如：
# components:
#   mc2_training@ops-transformer:
#   mc2_moe@ops-transformer:
#   mc2_moe_advanced@ops-transformer:
#   mc2_inference@ops-transformer:
#
# 对于一个组件，允许配置的字段如下：
# component_name@ops-transformer:
#   dirs: --------------------- [可选] 整目录豁免，按路径前缀匹配（host UT 通常不出覆盖的层）
#     - mc2/<op>/op_kernel/ --- 算子 kernel 目录一般需要豁免
#     - mc2/<op>/op_graph/ ---- 若 host UT 不看护 graph，也可整目录豁免
#   files: -------------------- [可选] 单文件或 glob 豁免（声明头 / 模板头 / 个案）
#     - mc2/<op>/op_api/aclnn_*.h
#     - mc2/<op>/op_api/*_base.h
#     - mc2/<op>/op_host/.../*_tiling_*.h
#
# 注意：禁止把应看护的 op_host / op_api 实现 .cpp 写入本文件；收到命中告警后及时删条目！

components:
  mc2_training@ops-transformer:
